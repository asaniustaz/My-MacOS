name: macOS Temporary VNC (Tailscale)

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      # 1. Generate password
      - name: Generate Password
        run: |
          PASS=$(openssl rand -base64 10)
          echo "VNC_PASS=$PASS" >> $GITHUB_ENV

      # 2. Install Tailscale (IMPORTANT FIX)
      - name: Install Tailscale
        run: |
          brew install tailscale

      # 3. Start Tailscale (FIXED DAEMON ISSUE)
      - name: Connect Tailscale
        run: |
          sudo launchctl load /Library/LaunchDaemons/com.tailscale.tailscaled.plist || true
          sleep 5

          tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=macos-${{ github.run_id }}

          sleep 10

          IP=$(tailscale ip -4 | head -n1)
          echo "TS_IP=$IP" >> $GITHUB_ENV

      # 4. Enable macOS Screen Sharing (VNC)
      - name: Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASS" \
            -restart -agent

      # 5. Send Telegram info
      - name: Send Telegram
        run: |
          MSG="🍏 macOS READY%0A%0AIP: $TS_IP%0APort: 5900%0APassword: $VNC_PASS"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"

      # 6. Keep session alive
      - name: Keep Alive
        run: |
          while true; do
            echo "macOS running..."
            sleep 300
          done

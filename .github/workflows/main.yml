name: macOS Temporary VNC (Fixed Tailscale)

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      # 1. Generate password
      - name: Generate Password
        run: |
          PASS=$(openssl rand -base64 10)
          echo "VNC_PASS=$PASS" >> $GITHUB_ENV

      # 2. Install Tailscale
      - name: Install Tailscale
        run: |
          brew install tailscale

      # 3. Connect Tailscale (NO launchctl, NO tailscaled)
      - name: Start Tailscale (Fixed)
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=macos-${{ github.run_id }} || true

          sleep 15

          tailscale status || true

          IP=$(tailscale ip -4 2>/dev/null | head -n1 || echo "NO_IP")
          echo "TS_IP=$IP" >> $GITHUB_ENV

      # 4. Enable VNC (macOS Screen Sharing)
      - name: Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASS" \
            -restart -agent || true

      # 5. Send Telegram Info
      - name: Send Telegram
        run: |
          MSG="🍏 macOS RDP READY%0A%0AIP: $TS_IP%0APort: 5900%0APassword: $VNC_PASS"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"

      # 6. Keep Alive
      - name: Keep Alive
        run: |
          while true; do
            echo "macOS running..."
            sleep 300
          done
